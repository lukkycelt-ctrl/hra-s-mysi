<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Herní koutek</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #111827, #1e3a8a);
      color: white;
    }
    .game {
      width: min(800px, 92vw);
      text-align: center;
    }
    h1 { margin-top: 0; }
    .info {
      display: flex;
      justify-content: space-between;
      margin-bottom: 12px;
      font-size: 22px;
      gap: 12px;
      flex-wrap: wrap;
    }
    #board {
      position: relative;
      width: 100%;
      height: 500px;
      max-height: 70vh;
      overflow: hidden;
      border: 3px solid #60a5fa;
      border-radius: 12px;
      background: #1f2937;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
    }
    #target {
      position: absolute;
      width: 54px;
      height: 54px;
      border-radius: 50%;
      background: #ef4444;
      box-shadow: 0 0 16px rgba(239, 68, 68, 0.8);
      cursor: pointer;
      display: none;
    }
    #target::after {
      content: "";
      position: absolute;
      inset: 14px;
      border-radius: 50%;
      background: white;
    }
    .primary-button, .back-button {
      margin: 12px 6px 0;
      padding: 12px 24px;
      border: 0;
      border-radius: 8px;
      color: white;
      font-size: 18px;
      cursor: pointer;
    }
    .primary-button { background: #22c55e; }
    .primary-button:hover { background: #16a34a; }
    .back-button { background: #475569; }
    .back-button:hover { background: #334155; }
    .game-choice {
      display: inline-block;
      width: min(340px, 100%);
      margin: 10px;
      padding: 24px;
      border: 2px solid #60a5fa;
      border-radius: 14px;
      background: rgba(31, 41, 55, 0.9);
      color: white;
      text-align: left;
      cursor: pointer;
    }
    .game-choice:hover { background: #263b5c; }
    .game-choice strong { display: block; margin-bottom: 8px; font-size: 22px; }
    #message {
      min-height: 24px;
      margin-top: 12px;
      color: #bfdbfe;
    }
    .hidden { display: none !important; }
    #memory-board {
      display: grid;
      grid-template-columns: repeat(4, minmax(70px, 130px));
      justify-content: center;
      gap: 12px;
      margin: 24px auto;
    }
    .memory-pad {
      height: 115px;
      border: 4px solid rgba(255, 255, 255, 0.35);
      border-radius: 18px;
      cursor: pointer;
      opacity: 0.75;
      transition: opacity 0.15s, transform 0.15s, filter 0.15s;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    .memory-pad:hover { opacity: 0.9; }
    .memory-pad.active {
      opacity: 1;
      transform: scale(1.05);
      filter: brightness(1.6);
      box-shadow: 0 0 28px currentColor;
    }
    #pad-0 { background: #ef4444; color: #ef4444; }
    #pad-1 { background: #22c55e; color: #22c55e; }
    #pad-2 { background: #3b82f6; color: #3b82f6; }
    #pad-3 { background: #eab308; color: #eab308; }
    #pad-4 { background: #a855f7; color: #a855f7; }
    #pad-5 { background: #f97316; color: #f97316; }
    #pad-6 { background: #06b6d4; color: #06b6d4; }
    #pad-7 { background: #ec4899; color: #ec4899; }
    @media (max-width: 480px) {
      .info { justify-content: center; font-size: 18px; }
      #memory-board {
        grid-template-columns: repeat(4, minmax(55px, 1fr));
        gap: 8px;
      }
      .memory-pad { height: 90px; border-radius: 13px; }
    }
  </style>
</head>
<body>
  <main class="game">
    <section id="menu">
      <h1>Herní koutek</h1>
      <p>Vyber si hru:</p>
      <button class="game-choice" id="choose-reflex">
        <strong>🎯 Reflexní terč</strong>
        Klikni co nejrychleji na terč a nasbírej co nejvíc bodů za 30 sekund.
      </button>
      <button class="game-choice" id="choose-memory">
        <strong>🧠 Barevná paměť</strong>
        Zapamatuj si pořadí barev a zopakuj ho. Každé kolo přidá jednu barvu.
      </button>
    </section>

    <section id="reflex-game" class="hidden">
      <h1>Reflexní terč</h1>
      <div class="info">
        <span>Skóre: <strong id="score">0</strong></span>
        <span>Nejlepší: <strong id="best">0</strong></span>
        <span>Čas: <strong id="time">30</strong> s</span>
      </div>
      <div id="board" aria-label="Hrací plocha">
        <div id="target" aria-hidden="true"></div>
      </div>
      <div id="message" aria-live="polite">Střed terče je za 2 body, okraj za 1 bod. Kliknutí vedle odečte 2 body.</div>
      <button class="primary-button" id="start">Začít hrát</button>
      <button class="back-button back-to-menu">← Výběr her</button>
    </section>

    <section id="memory-game" class="hidden">
      <h1>Barevná paměť</h1>
      <div class="info">
        <span>Kolo: <strong id="round">0</strong></span>
        <span>Rekord: <strong id="memory-best">0</strong></span>
      </div>
      <p id="memory-message" aria-live="polite">Zapamatuj si pořadí barev a zopakuj ho klikáním.</p>
      <div id="memory-board" aria-label="Barevná hrací plocha">
        <div class="memory-pad" id="pad-0" data-color="0" aria-label="Červená"></div>
        <div class="memory-pad" id="pad-1" data-color="1" aria-label="Zelená"></div>
        <div class="memory-pad" id="pad-2" data-color="2" aria-label="Modrá"></div>
        <div class="memory-pad" id="pad-3" data-color="3" aria-label="Žlutá"></div>
        <div class="memory-pad" id="pad-4" data-color="4" aria-label="Fialová"></div>
        <div class="memory-pad" id="pad-5" data-color="5" aria-label="Oranžová"></div>
        <div class="memory-pad" id="pad-6" data-color="6" aria-label="Tyrkysová"></div>
        <div class="memory-pad" id="pad-7" data-color="7" aria-label="Růžová"></div>
      </div>
      <button class="primary-button" id="memory-start">Začít hru</button>
      <button class="back-button back-to-menu">← Výběr her</button>
    </section>
  </main>

  <script>
    const menu = document.getElementById("menu");
    const reflexGame = document.getElementById("reflex-game");
    const memoryGame = document.getElementById("memory-game");
    const board = document.getElementById("board");
    const target = document.getElementById("target");
    const startButton = document.getElementById("start");
    const scoreText = document.getElementById("score");
    const bestText = document.getElementById("best");
    const timeText = document.getElementById("time");
    const message = document.getElementById("message");

    const BEST_SCORE_KEY = "reflexniHraNejlepsiSkore";
    const MEMORY_BEST_KEY = "barevnaPametNejlepsiKolo";
    let score = 0;
    let timeLeft = 30;
    let timer;
    let gameRunning = false;
    let bestScore = Number(localStorage.getItem(BEST_SCORE_KEY)) || 0;
    bestText.textContent = bestScore;

    function showGame(which) {
      menu.classList.add("hidden");
      reflexGame.classList.toggle("hidden", which !== "reflex");
      memoryGame.classList.toggle("hidden", which !== "memory");
    }

    function returnToMenu() {
      gameRunning = false;
      clearInterval(timer);
      stopMemoryGame();
      target.style.display = "none";
      menu.classList.remove("hidden");
      reflexGame.classList.add("hidden");
      memoryGame.classList.add("hidden");
    }

    function updateBestScore() {
      if (score > bestScore) {
        bestScore = score;
        bestText.textContent = bestScore;
        localStorage.setItem(BEST_SCORE_KEY, String(bestScore));
      }
    }

    function moveTarget() {
      const maxX = board.clientWidth - target.offsetWidth;
      const maxY = board.clientHeight - target.offsetHeight;
      const oldX = parseFloat(target.style.left) || 0;
      const oldY = parseFloat(target.style.top) || 0;
      let x;
      let y;
      let attempts = 0;
      do {
        x = Math.random() * maxX;
        y = Math.random() * maxY;
        attempts++;
      } while (attempts < 10 && Math.hypot(x - oldX, y - oldY) < target.offsetWidth * 2);
      target.style.left = x + "px";
      target.style.top = y + "px";
    }

    function finishGame() {
      gameRunning = false;
      clearInterval(timer);
      target.style.display = "none";
      startButton.textContent = "Hrát znovu";
      startButton.style.display = "inline-block";
      message.textContent = "Čas vypršel! Tvé skóre: " + score;
    }

    function startGame() {
      score = 0;
      timeLeft = 30;
      gameRunning = true;
      scoreText.textContent = score;
      timeText.textContent = timeLeft;
      message.textContent = "Střed terče je za 2 body, okraj za 1 bod. Kliknutí vedle odečte 2 body.";
      startButton.style.display = "none";
      target.style.display = "block";
      moveTarget();
      clearInterval(timer);
      timer = setInterval(() => {
        timeLeft--;
        timeText.textContent = timeLeft;
        if (timeLeft <= 0) finishGame();
      }, 1000);
    }

    target.addEventListener("click", (event) => {
      if (!gameRunning) return;
      const bounds = target.getBoundingClientRect();
      const centerX = bounds.left + bounds.width / 2;
      const centerY = bounds.top + bounds.height / 2;
      const distance = Math.hypot(event.clientX - centerX, event.clientY - centerY);
      const hitCenter = distance <= 13;
      score += hitCenter ? 2 : 1;
      scoreText.textContent = score;
      message.textContent = hitCenter ? "Zásah do středu! +2 body" : "Zásah na okraj! +1 bod";
      updateBestScore();
      moveTarget();
    });

    board.addEventListener("click", (event) => {
      if (!gameRunning || event.target === target) return;
      score -= 2;
      scoreText.textContent = score;
      message.textContent = "Vedle! Odečteny 2 body, cíl se přesunul.";
      moveTarget();
    });

    const memoryPads = [...document.querySelectorAll(".memory-pad")];
    const memoryMessage = document.getElementById("memory-message");
    const roundText = document.getElementById("round");
    const memoryBestText = document.getElementById("memory-best");
    const memoryStartButton = document.getElementById("memory-start");
    let sequence = [];
    let playerStep = 0;
    let memoryRound = 0;
    let acceptingInput = false;
    let memoryTimers = [];
    let memoryBest = Number(localStorage.getItem(MEMORY_BEST_KEY)) || 0;
    memoryBestText.textContent = memoryBest;

    function stopMemoryGame() {
      memoryTimers.forEach(clearTimeout);
      memoryTimers = [];
      acceptingInput = false;
      memoryPads.forEach((pad) => pad.classList.remove("active"));
    }

    function flashPad(color, duration = 450) {
      const pad = memoryPads[color];
      pad.classList.add("active");
      const timerId = setTimeout(() => pad.classList.remove("active"), duration);
      memoryTimers.push(timerId);
    }

    function startMemoryGame() {
      stopMemoryGame();
      sequence = [];
      playerStep = 0;
      memoryRound = 0;
      roundText.textContent = "0";
      memoryStartButton.style.display = "none";
      nextMemoryRound();
    }

    function nextMemoryRound() {
      acceptingInput = false;
      memoryRound++;
      roundText.textContent = String(memoryRound);
      sequence.push(Math.floor(Math.random() * memoryPads.length));
      memoryMessage.textContent = "Pozor! Zapamatuj si pořadí…";

      sequence.forEach((color, index) => {
        const timerId = setTimeout(() => flashPad(color), 550 + index * 750);
        memoryTimers.push(timerId);
      });

      const unlockTimer = setTimeout(() => {
        acceptingInput = true;
        playerStep = 0;
        memoryMessage.textContent = "Teď zopakuj sekvenci klikáním na barvy.";
      }, 550 + sequence.length * 750);
      memoryTimers.push(unlockTimer);
    }

    function memoryGameOver() {
      stopMemoryGame();
      const completedRounds = memoryRound - 1;
      memoryMessage.textContent = "Konec hry! Zvládl/a jsi " + completedRounds + " " + (completedRounds === 1 ? "kolo" : "kol") + ".";
      memoryStartButton.textContent = "Zkusit znovu";
      memoryStartButton.style.display = "inline-block";
    }

    memoryPads.forEach((pad) => {
      pad.addEventListener("click", () => {
        if (!acceptingInput) return;
        const chosenColor = Number(pad.dataset.color);
        flashPad(chosenColor, 180);

        if (chosenColor !== sequence[playerStep]) {
          memoryGameOver();
          return;
        }

        playerStep++;
        if (playerStep === sequence.length) {
          acceptingInput = false;
          if (memoryRound > memoryBest) {
            memoryBest = memoryRound;
            memoryBestText.textContent = String(memoryBest);
            localStorage.setItem(MEMORY_BEST_KEY, String(memoryBest));
          }
          memoryMessage.textContent = "Správně! Připrav se na další kolo.";
          const nextTimer = setTimeout(nextMemoryRound, 900);
          memoryTimers.push(nextTimer);
        }
      });
    });

    document.getElementById("choose-reflex").addEventListener("click", () => showGame("reflex"));
    document.getElementById("choose-memory").addEventListener("click", () => showGame("memory"));
    document.querySelectorAll(".back-to-menu").forEach((button) => button.addEventListener("click", returnToMenu));
    startButton.addEventListener("click", startGame);
    memoryStartButton.addEventListener("click", startMemoryGame);
  </script>
</body>
</html>
