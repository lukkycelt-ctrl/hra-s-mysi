<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reflexní hra</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #111827, #1e3a8a);
      color: white;
    }
    .game {
      width: min(800px, 92vw);
      text-align: center;
    }
    .info {
      display: flex;
      justify-content: space-between;
      margin-bottom: 12px;
      font-size: 22px;
      gap: 12px;
      flex-wrap: wrap;
    }
    #board {
      position: relative;
      width: 100%;
      height: 500px;
      max-height: 70vh;
      overflow: hidden;
      border: 3px solid #60a5fa;
      border-radius: 12px;
      background: #1f2937;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
    }
    #target {
      position: absolute;
      width: 54px;
      height: 54px;
      border-radius: 50%;
      background: #ef4444;
      box-shadow: 0 0 16px rgba(239, 68, 68, 0.8);
      cursor: pointer;
      display: none;
      transition: left 1.2s ease, top 1.2s ease;
    }
    #target::after {
      content: "";
      position: absolute;
      inset: 14px;
      border-radius: 50%;
      background: white;
    }
    #start {
      margin-top: 20px;
      padding: 12px 28px;
      border: 0;
      border-radius: 8px;
      background: #22c55e;
      color: white;
      font-size: 18px;
      cursor: pointer;
      transition: background 0.2s;
    }
    #start:hover { background: #16a34a; }
    #message {
      min-height: 24px;
      margin-top: 12px;
      color: #bfdbfe;
    }
  </style>
</head>
<body>
  <main class="game">
    <div class="info">
      <span>Skóre: <strong id="score">0</strong></span>
      <span>Nejlepší: <strong id="best">0</strong></span>
      <span>Čas: <strong id="time">30</strong> s</span>
    </div>

    <div id="board" aria-label="Hrací plocha">
      <div id="target" aria-hidden="true"></div>
    </div>

    <div id="message" aria-live="polite">Klikni na cíl. Střed terče je za 2 body, okraj za 1 bod. Každý pátý cíl se pohybuje. Kliknutí vedle odečte 2 body.</div>
    <button id="start">Začít hrát</button>
  </main>

  <script>
    const board = document.getElementById("board");
    const target = document.getElementById("target");
    const startButton = document.getElementById("start");
    const scoreText = document.getElementById("score");
    const bestText = document.getElementById("best");
    const timeText = document.getElementById("time");
    const message = document.getElementById("message");

    const BEST_SCORE_KEY = "reflexniHraNejlepsiSkore";
    let score = 0;
    let timeLeft = 30;
    let timer;
    let movementTimer;
    let hitCount = 0;
    let gameRunning = false;
    let bestScore = Number(localStorage.getItem(BEST_SCORE_KEY)) || 0;
    bestText.textContent = bestScore;

    function updateBestScore() {
      if (score > bestScore) {
        bestScore = score;
        bestText.textContent = bestScore;
        localStorage.setItem(BEST_SCORE_KEY, String(bestScore));
      }
    }

    function moveTarget() {
      const maxX = board.clientWidth - target.offsetWidth;
      const maxY = board.clientHeight - target.offsetHeight;
      target.style.left = Math.random() * maxX + "px";
      target.style.top = Math.random() * maxY + "px";
    }

    function stopTargetMovement() {
      clearInterval(movementTimer);
      movementTimer = undefined;
    }

    function finishGame() {
      gameRunning = false;
      clearInterval(timer);
      stopTargetMovement();
      target.style.display = "none";
      startButton.textContent = "Hrát znovu";
      startButton.style.display = "inline-block";
      message.textContent = "Čas vypršel! Tvé skóre: " + score;
    }

    function startGame() {
      score = 0;
      timeLeft = 30;
      hitCount = 0;
      gameRunning = true;
      scoreText.textContent = score;
      timeText.textContent = timeLeft;
      message.textContent = "Střed terče je za 2 body, okraj za 1 bod. Každý pátý cíl se pohybuje. Kliknutí vedle odečte 2 body.";
      startButton.style.display = "none";
      target.style.display = "block";
      stopTargetMovement();
      moveTarget();

      clearInterval(timer);
      timer = setInterval(() => {
        timeLeft--;
        timeText.textContent = timeLeft;
        if (timeLeft <= 0) finishGame();
      }, 1000);
    }

    target.addEventListener("click", (event) => {
      if (!gameRunning) return;

      stopTargetMovement();
      const bounds = target.getBoundingClientRect();
      const centerX = bounds.left + bounds.width / 2;
      const centerY = bounds.top + bounds.height / 2;
      const distance = Math.hypot(event.clientX - centerX, event.clientY - centerY);
      const hitCenter = distance <= 13;
      const points = hitCenter ? 2 : 1;

      score += points;
      hitCount++;
      scoreText.textContent = score;
      const hitMessage = hitCenter ? "Zásah do středu! +2 body" : "Zásah na okraj! +1 bod";
      updateBestScore();
      moveTarget();

      if (hitCount % 5 === 4) {
        message.textContent = hitMessage + " Další cíl se bude pohybovat pomaleji!";
        movementTimer = setInterval(moveTarget, 1600);
      } else {
        message.textContent = hitMessage;
      }
    });

    board.addEventListener("click", (event) => {
      if (!gameRunning || event.target === target) return;
      score -= 2;
      scoreText.textContent = score;
      message.textContent = "Vedle! Odečteny 2 body, cíl se přesunul.";
      moveTarget();
    });

    startButton.addEventListener("click", startGame);
  </script>
</body>
</html>
